openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: RANG automotive storefront and operations API
servers:
  - url: /api
tags:
  - name: health
  - name: storefront
  - name: cart
  - name: orders
  - name: support
  - name: account
  - name: auth
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current native authentication session
      responses:
        "200":
          description: Current session or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email address already in use
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Email or password is incorrect
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password recovery email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "202":
          description: Recovery request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          description: Email delivery is not configured
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a recovery token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password changed and existing sessions revoked
        "400":
          description: Recovery link is invalid or expired
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
        "401":
          description: Current password is incorrect or user is signed out
  /storefront:
    get:
      operationId: getStorefront
      tags: [storefront]
      summary: Get store settings and featured products
      responses:
        "200":
          description: Storefront summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
  /storefront/hero-image:
    get:
      operationId: getHeroImage
      tags: [storefront]
      summary: Get the current homepage hero image
      responses:
        "200":
          description: Persisted hero image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: No uploaded hero image is available
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List active product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: Search and filter the product catalog
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: availability
          schema: { type: string, enum: [all, in_stock] }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: compatibilityMake
          schema: { type: string }
        - in: query
          name: compatibilityModel
          schema: { type: string }
        - in: query
          name: compatibilityYear
          schema: { type: integer, minimum: 1886, maximum: 2100 }
      responses:
        "200":
          description: Paginated product results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get product details
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sitemap.xml:
    get:
      operationId: getSitemap
      tags: [storefront]
      summary: Get public storefront and product sitemap
      responses:
        "200":
          description: XML sitemap for public pages and published products
          content:
            application/xml:
              schema: { type: string }
  /product-images/{imageId}:
    get:
      operationId: getProductImage
      tags: [storefront]
      summary: Retrieve a public product image
      parameters:
        - in: path
          name: imageId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Image not found
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current cart
      responses:
        "200":
          description: Cart with current server prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/CartItemAddInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid quantity or unavailable product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cart/items/{productId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Set a cart item quantity
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a product from the cart
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /checkout:
    post:
      operationId: submitOrder
      tags: [orders]
      summary: Submit a cash-on-delivery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Order submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "409":
          description: Stock changed or duplicate order key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Store checkout settings are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get the signed-in customer profile
      responses:
        "200":
          description: Customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Sign in required
    patch:
      operationId: updateAccount
      tags: [account]
      summary: Update the signed-in customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /orders:
    get:
      operationId: listCustomerOrders
      tags: [orders]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderNumber}:
    get:
      operationId: getCustomerOrder
      tags: [orders]
      summary: Get an owned order and its tracking state
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get sales and operations metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Staff access required
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: Search admin product records
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: lowStock
          description: Return products with five or fewer available units.
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Admin product results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/products/{productId}:
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get complete product details for administration
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Remove a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Product removed
  /admin/products/{productId}/images:
    post:
      operationId: uploadProductImage
      tags: [admin]
      summary: Upload a validated product image
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductImageUpload"
      responses:
        "201":
          description: Image saved in PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
  /admin/products/{productId}/images/{imageId}:
    delete:
      operationId: deleteProductImage
      tags: [admin]
      summary: Remove a product image
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: imageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Image removed
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Remove an empty category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Category removed
  /admin/categories/{categoryId}/image:
    post:
      operationId: uploadCategoryImage
      tags: [admin]
      summary: Upload a category image
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryImageUpload"
      responses:
        "200":
          description: Category image saved in PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: Search and filter orders
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{orderId}:
    patch:
      operationId: updateOrder
      tags: [admin]
      summary: Update payment and fulfillment states
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /support/messages:
    post:
      operationId: createSupportMessage
      tags: [support]
      summary: Send a message to the parts desk inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageInput"
      responses:
        "201":
          description: Message saved to the staff inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessageReceipt"
        "400":
          description: Message details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages were submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/support/messages:
    get:
      operationId: listAdminSupportMessages
      tags: [admin]
      summary: List customer messages in the staff inbox
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, resolved] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Staff inbox messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminSupportMessages"
  /admin/support/messages/{messageId}:
    patch:
      operationId: updateAdminSupportMessageById
      tags: [admin]
      summary: Mark a support message open or resolved
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessageUpdate"
      responses:
        "200":
          description: Updated support message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportMessage"
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Search customer accounts
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get store configuration
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update currency, delivery, and payment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
  /admin/settings/hero-image:
    post:
      operationId: uploadHeroImage
      tags: [admin]
      summary: Replace the homepage hero image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/HeroImageUpload"
      responses:
        "200":
          description: Stored homepage hero image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroImage"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    SupportMessageInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        subject: { type: string, minLength: 3, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 3000 }
    SupportMessageReceipt:
      type: object
      required: [id, createdAt, message]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        message: { type: string }
    AdminSupportMessage:
      type: object
      required: [id, name, email, phone, subject, message, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        subject: { type: string }
        message: { type: string }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: string, format: date-time }
    ListAdminSupportMessages:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminSupportMessage" }
        total: { type: integer }
    SupportMessageUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, resolved] }
    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [customer, staff, admin] }
    AuthSession:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        expiresAt: { type: ["string", "null"], format: date-time }
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        name: { type: string, minLength: 2, maxLength: 160 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Category:
      type: object
      required: [id, name, slug, productCount, imageUrl]
      properties:
        id: { type: string }
