openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: RANG automotive storefront and operations API
servers:
  - url: /api
tags:
  - name: health
  - name: storefront
  - name: cart
  - name: orders
  - name: account
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront:
    get:
      operationId: getStorefront
      tags: [storefront]
      summary: Get store settings and featured products
      responses:
        "200":
          description: Storefront summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List active product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: Search and filter the product catalog
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: availability
          schema: { type: string, enum: [all, in_stock] }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
        - in: query
          name: minPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: integer, minimum: 0 }
        - in: query
          name: compatibilityMake
          schema: { type: string }
        - in: query
          name: compatibilityModel
          schema: { type: string }
        - in: query
          name: compatibilityYear
          schema: { type: integer, minimum: 1886, maximum: 2100 }
      responses:
        "200":
          description: Paginated product results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get product details
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /product-images/{imageId}:
    get:
      operationId: getProductImage
      tags: [storefront]
      summary: Retrieve a public product image
      parameters:
        - in: path
          name: imageId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Image not found
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current cart
      responses:
        "200":
          description: Cart with current server prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/CartItemAddInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid quantity or unavailable product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cart/items/{productId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Set a cart item quantity
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a product from the cart
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /checkout:
    post:
      operationId: submitOrder
      tags: [orders]
      summary: Submit a cash-on-delivery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Order submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "409":
          description: Stock changed or duplicate order key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Store checkout settings are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get the signed-in customer profile
      responses:
        "200":
          description: Customer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          description: Sign in required
    patch:
      operationId: updateAccount
      tags: [account]
      summary: Update the signed-in customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /orders:
    get:
      operationId: listCustomerOrders
      tags: [orders]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderNumber}:
    get:
      operationId: getCustomerOrder
      tags: [orders]
      summary: Get an owned order and its tracking state
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get sales and operations metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Staff access required
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: Search admin product records
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Admin product results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Remove a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Product removed
  /admin/products/{productId}/images:
    post:
      operationId: uploadProductImage
      tags: [admin]
      summary: Upload a validated product image
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductImageUpload"
      responses:
        "201":
          description: Image saved in PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Remove an empty category
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Category removed
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: Search and filter orders
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{orderId}:
    patch:
      operationId: updateOrder
      tags: [admin]
      summary: Update payment and fulfillment states
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Search customer accounts
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get store configuration
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update currency, delivery, and payment configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    Category:
      type: object
      required: [id, name, slug, productCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        productCount: { type: integer }
        active: { type: boolean }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"] }
        active: { type: boolean }
    ProductCard:
      type: object
      required: [id, slug, name, sku, brand, priceMinor, salePriceMinor, stock, published, compatibilityStatus, imageUrl, category]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        sku: { type: string }
        brand: { type: ["string", "null"] }
        priceMinor: { type: integer }
        salePriceMinor: { type: ["integer", "null"] }
        stock: { type: integer }
        published: { type: boolean }
        compatibilityStatus: { type: string, enum: [verified, unknown] }
        imageUrl: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductCard"
        - type: object
          required: [description, specifications, images, compatibility, createdAt]
          properties:
            description: { type: string }
            specifications: { type: object, additionalProperties: true }
            images:
              type: array
              items: { $ref: "#/components/schemas/ProductImage" }
            compatibility:
              type: array
              items: { $ref: "#/components/schemas/Compatibility" }
            createdAt: { type: string, format: date-time }
            related:
              type: array
              items: { $ref: "#/components/schemas/ProductCard" }
    ProductImage:
      type: object
      required: [id, url, contentType, size]
      properties:
        id: { type: string }
        url: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer }
        altText: { type: ["string", "null"] }
    ProductImageUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        altText: { type: string, maxLength: 200 }
    Compatibility:
      type: object
      required: [make, model, yearFrom, yearTo, verified]
      properties:
        make: { type: string }
        model: { type: string }
        yearFrom: { type: integer }
        yearTo: { type: integer }
        verified: { type: boolean }
    CompatibilityInput:
      type: object
      required: [make, model, yearFrom, yearTo]
      properties:
        make: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 100 }
        yearFrom: { type: integer, minimum: 1886, maximum: 2100 }
        yearTo: { type: integer, minimum: 1886, maximum: 2100 }
        verified: { type: boolean, default: false }
    ProductPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductCard" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    ProductInput:
      type: object
      required: [name, sku, slug, priceMinor, categoryId, description, stock]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        sku: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        brand: { type: ["string", "null"] }
        priceMinor: { type: integer, minimum: 0 }
        salePriceMinor: { type: ["integer", "null"], minimum: 0 }
        categoryId: { type: string }
        description: { type: string }
        specifications: { type: object, additionalProperties: true }
        stock: { type: integer, minimum: 0 }
        published: { type: boolean }
        compatibility:
          type: array
          items: { $ref: "#/components/schemas/CompatibilityInput" }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        sku: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        brand: { type: ["string", "null"] }
        priceMinor: { type: integer, minimum: 0 }
        salePriceMinor: { type: ["integer", "null"], minimum: 0 }
        categoryId: { type: string }
        description: { type: string }
        specifications: { type: object, additionalProperties: true }
        stock: { type: integer, minimum: 0 }
        published: { type: boolean }
        compatibility:
          type: array
          items: { $ref: "#/components/schemas/CompatibilityInput" }
    Storefront:
      type: object
      required: [settings, categories, featured]
      properties:
        settings: { $ref: "#/components/schemas/StoreSettings" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        featured:
          type: array
          items: { $ref: "#/components/schemas/ProductCard" }
    StoreSettings:
      type: object
      required: [currency, currencyConfigured, deliveryFeeMinor, deliveryRegions, cashOnDeliveryEnabled, onlinePaymentsEnabled, storeName]
      properties:
        currency: { type: ["string", "null"] }
        currencyConfigured: { type: boolean }
        deliveryFeeMinor: { type: integer }
        deliveryRegions:
          type: array
          items: { type: string }
        cashOnDeliveryEnabled: { type: boolean }
        onlinePaymentsEnabled: { type: boolean }
        storeName: { type: string }
        supportEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
    StoreSettingsInput:
      type: object
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        deliveryFeeMinor: { type: integer, minimum: 0 }
        deliveryRegions:
          type: array
          items: { type: string }
        cashOnDeliveryEnabled: { type: boolean }
        onlinePaymentsEnabled: { type: boolean, const: false }
        storeName: { type: string, minLength: 1, maxLength: 140 }
        supportEmail: { type: ["string", "null"], format: email }
        contactPhone: { type: ["string", "null"], maxLength: 32 }
    Cart:
      type: object
      required: [items, currency, subtotalMinor, deliveryFeeMinor, totalMinor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        currency: { type: ["string", "null"] }
        subtotalMinor: { type: integer }
        deliveryFeeMinor: { type: integer }
        totalMinor: { type: integer }
    CartItem:
      type: object
      required: [productId, quantity, unitPriceMinor, lineTotalMinor, product]
      properties:
        productId: { type: string }
        quantity: { type: integer }
        unitPriceMinor: { type: integer }
        lineTotalMinor: { type: integer }
        product: { $ref: "#/components/schemas/ProductCard" }
    CartItemInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 50 }
    CartItemAddInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 50 }
    CheckoutInput:
      type: object
      required: [idempotencyKey, name, email, phone, address, city, region]
      properties:
        idempotencyKey: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 5, maxLength: 32 }
        address: { type: string, minLength: 5, maxLength: 300 }
        city: { type: string, minLength: 2, maxLength: 100 }
        region: { type: string, minLength: 2, maxLength: 100 }
        deliveryNotes: { type: string, maxLength: 500 }
    CheckoutResult:
      type: object
      required: [orderNumber, orderStatus, paymentStatus, fulfillmentStatus, totalMinor, currency]
      properties:
        orderNumber: { type: string }
        orderStatus: { type: string }
        paymentStatus: { type: string }
        fulfillmentStatus: { type: string }
        totalMinor: { type: integer }
        currency: { type: string }
    Order:
      type: object
      required: [id, orderNumber, orderStatus, paymentStatus, paymentMethod, fulfillmentStatus, totalMinor, currency, createdAt, items, customerName, customerEmail, customerPhone, deliveryAddress, deliveryCity, deliveryRegion, deliveryFeeMinor]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        orderStatus: { type: string, enum: [submitted, confirmed, cancelled] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded, cod_due] }
        paymentMethod: { type: string, enum: [cash_on_delivery, online] }
        fulfillmentStatus: { type: string, enum: [unfulfilled, processing, fulfilled] }
        totalMinor: { type: integer }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        customerPhone: { type: string }
        deliveryAddress: { type: string }
        deliveryCity: { type: string }
        deliveryRegion: { type: string }
        deliveryNotes: { type: ["string", "null"] }
        deliveryFeeMinor: { type: integer }
        staffNote: { type: ["string", "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderItem:
      type: object
      required: [name, sku, quantity, unitPriceMinor, lineTotalMinor]
      properties:
        name: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        unitPriceMinor: { type: integer }
        lineTotalMinor: { type: integer }
    OrderUpdate:
      type: object
      properties:
        orderStatus: { type: string, enum: [submitted, confirmed, cancelled] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded, cod_due] }
        fulfillmentStatus: { type: string, enum: [unfulfilled, processing, fulfilled] }
        staffNote: { type: string, maxLength: 500 }
    Customer:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [customer, staff, admin] }
        orderCount: { type: integer }
    AccountUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: ["string", "null"], maxLength: 32 }
    AdminOverview:
      type: object
      required: [ordersToday, pendingOrders, lowStockProducts, customers, salesTodayMinor, currency]
      properties:
        ordersToday: { type: integer }
        pendingOrders: { type: integer }
        lowStockProducts: { type: integer }
        customers: { type: integer }
        salesTodayMinor: { type: integer }
        currency: { type: ["string", "null"] }
