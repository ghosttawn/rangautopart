kind = "web"
previewPath = "/"
title = "RANG Auto Parts"
description = "A responsive automotive parts storefront and secure operations dashboard for RANG ATV/AUTO PART/V ACCESSORIES, backed by PostgreSQL for products, inventory, customers, and orders."
version = "1.0.0"
id = "artifacts/rang-auto-parts"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20476

[services.development]
run = "pnpm --filter @workspace/rang-auto-parts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rang-auto-parts", "run", "build" ]
serve = "static"
publicDir = "artifacts/rang-auto-parts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20476"
BASE_PATH = "/"
